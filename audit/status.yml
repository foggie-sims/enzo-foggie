      - id: T1.13
        title: "Fix latent bugs: case-21 fall-through, sink-path double free, CreateSUBlingList leak, Hilbert OOB/overflow, ReceiveRegion wrong-array zeroing, uninitialized APTotalNumber"
        ref: "A"
        class: C0
        status: done
        prs: []
        tests: ["Local serial A/B vs T1.2/3 build: feedback logs byte-identical, all dump payloads h5diff-identical", "CI green on 3cd159df (run 30521958589, incl. ASan/UBSan)", "FOGGIE-bench t13-latent-r1: PASS class C0 vs the envelope floor"]
        note: "All six fixed: case-21 break added (was falling into CommunicationSendActiveParticles); sink deposit was a use-after-free + double free (restore block read freed ParticleMassPointerSink) - freed once after restore; CreateSUBlingList FluxCorrection==0 early return leaked Grids/ChildGrids; APTotalNumber accumulated from garbage; ReceiveRegion zeroed live BaryonField instead of the new OldBaryonField (data corruption where it fired); Hilbert balancers got 64-bit work sums, complete degenerate-partition guards (old ==0 check missed -1 -> HilbertData[-1]), bounded mover loops, zero-work division guard - applied to RootGrids and both live LoadBalanceHilbertCurve copies."
      - id: T1.14
        title: "Diagnose parallel run-to-run nondeterminism in hydro AMR (message-order-dependent flux/boundary accumulation); extend BITWISE_IDENTICALITY beyond gravity/photons or document ordering guarantees"
        ref: "4.2"
        class: C1
        status: todo
        prs: []
        tests: ["https://github.com/foggie-sims/enzo-foggie/actions/runs/30381349766"]
        note: "Discovered by CI, quantified at production scale by FOGGIE-bench A1/A2 (identical code, 5 root steps from production restart): rel mass diffs grow ~1 decade per root step, 1e-11 to 1e-7 by step 5; refinement structure diverges by step 4; +-1 star formation event; wall-clock noise 2.2%. Production A/B gating therefore uses the measured noise floor (compare_runs.py --noise-floor)."

