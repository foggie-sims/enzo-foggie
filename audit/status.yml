        title: "Verify CONFIG_FAST_SIB = yes and CONFIG_PFLOAT_16 not set in production builds"
        ref: "3.3"
        class: C0
        status: done
        prs: []
        tests: ["CI: 'Guard build configuration' step in enzo-performance-ci.yml"]
        note: "Enforced automatically by the branch CI on every push/PR"
      - id: T0.9
        title: "Check in a FOGGIE production parameter deck under run/"
        ref: "4.1"
        class: C0
        status: todo
        prs: []
        tests: []

  - id: tier1
    name: "Tier 1 - trivial-to-low-effort code fixes"
    description: "Minutes to hours each"
    items:
      - id: T1.1
        title: "Guard StarParticleFindAll when no Star-framework type is enabled"
        ref: "5.1"
        class: C0
        status: done
        prs: []
        tests: ["Local serial A/B (TabularFeedbackTest deck, old exe vs guarded exe): all HDF5 payloads h5diff-identical, feedback/star logs byte-identical", "CI green on d25c550c (run 30512578492): build, smoke, gravity gate, both serial bitwise determinism pairs, sanitizers", "FOGGIE-bench t11-guard-r1: PASS class C0 vs the 1x128 envelope noise floor (baseline = t18-r7 candidate run)"]
        note: "Probe-once guard in StarParticleInitialize: with no framework maker enabled (POP3/colored-POP3/cluster/MBH/BigStarFormation/StarParticleRadiativeFeedback), StarParticleFindAll runs once to check for legacy framework stars in the data, then the Star-object machinery is skipped for the rest of the run. FOGGIE config (H2REG_STAR + MECH feedback) skips ~1e10 particle-type comparisons + one allgather per level-subcycle. Wall-clock effect at the anchor below the 0.5% timing noise (2411.5 vs 2414.1 s over 5 root steps) - the removed work is real but small at 128 ranks; expected to matter more as the allgather scales with rank count. Archive: results/t11-guard-r1/ on bench-results."
      - id: T1.2
        title: "Hoist IdentifySpeciesFields out of the mu_field cell loop; skip mu_field on starless grids"
        ref: "5.1"
        class: C0
        status: done
        prs: []
        tests: ["Local serial A/B vs T1.1 build: feedback logs byte-identical, all dump payloads h5diff-identical", "CI green on eb4eb451 (run 30515147467)", "FOGGIE-bench t12-mufield-r1: PASS class C0 vs the envelope floor (mesh bit-identical every dump; one particle level swap at DD0398, within the measured migration noise channel)"]
        note: "Both MOM_STAR and MECH_STAR branches: species indices looked up once per grid (was: 12 linear field searches per cell); the whole mu_field fill skipped when the grid has no PARTICLE_TYPE_STAR particles (the feedback Fortran reads mu only inside its type==2 particle loop). Wall clock 2397.4 vs 2411.5 s (0.6% faster, at the noise edge). Bench initially FAILed on a conflated structure gate - see the comparator refinement recorded in t12-mufield-r1/state.json on bench-results."
      - id: T1.3
        title: "Delete or gate the per-cell mu file write"
        ref: "5.1"
        class: C0
        status: done
        prs: []
        tests: ["Local serial A/B vs T1.1 build: feedback logs byte-identical, all dump payloads h5diff-identical", "CI green on eb4eb451 (run 30515147467)", "FOGGIE-bench t12-mufield-r1: PASS class C0 (shared stamp with T1.2, same commit)"]
        note: "Deleted: all ranks appended to one shared mu_and_baryon_fields.txt whenever mu left [0.0625, 2] - a filesystem-serializing hazard, and redundant because star_feedback6.F clamps mu_cell to exactly that range (NaN included) before use."
      - id: T1.4
        title: "Age cutoff + call reordering in star_feedback6.F; reconcile StarFeedbackSNePerTimestepLimit default vs docs"
        ref: "5.1"
        class: C2
        status: todo
        prs: []
        tests: []
      - id: T1.5
        title: "Gate ComputeCoolingTime on StarMakerThermalCrit; right-size AllocateNewParticles"
        ref: "5.1"
        class: C0
        status: done
        prs: []
        tests: ["Local serial A/B vs T1.6 build: feedback logs byte-identical, all dump payloads h5diff-identical", "CI green on 4051c0b7 (run 30529490479)", "FOGGIE-bench t15-coolgate-r1: PASS class C0 vs the envelope floor; wall clock 2231.3 s vs 2420.1 s baseline (~7% vs the two-sample baseline mean) - the first Tier-1 gain decisively above node scatter"]
        note: "Creation prologue (fake grid + 0.25*size particle buffers + cooling time) now gated on a maker branch actually executing this call - for FOGGIE (H2REG + StarFormationOncePerRootGridTimeStep=1) that is the once-per-root-step SF window instead of every subcycle. ComputeCoolingTime computed only for makers that read it, verified per call site (star_maker2 only under StarMakerThermalCrit; MOM/UNIGRID/POP3/STAR_CLUSTER/INSTANT/DISTR; NOT H2REG/KRAVTSOV/SSN) - for FOGGIE it is eliminated entirely (the audit's hidden near-doubling of the cooling budget). MHD_RK energy re-add deliberately left outside the gate (its paired subtraction is unconditional). The 0.25*size cap itself left as-is: shrinking it could alter star formation if hit (C0 contract)."
      - id: T1.6
        title: "Make star_feedback6.F grid arrays allocatable + early return when no feedback; seed the RNG"
        ref: "5.1"
        class: C2
        status: done
        prs: []
        tests: ["CI: 'Determinism - star feedback serial runs' step (bitwise A/B on TabularFeedbackTest)", "Local serial A/B vs T1.13 build: feedback logs byte-identical, all dump payloads h5diff-identical", "CI green on db3daf2b (run 30525447698)", "FOGGIE-bench t16-feedback6-r1: PASS class C0 vs the envelope floor"]
        note: "Complete. RNG seeding (earlier) + now: the 14 full-grid accumulators are heap-allocatable (were ~38 MB of automatic stack per call at 70^3/-r8 - the audit's stack-overflow crash class); early return before logs/allocation/zeroing when no particle passes the star filter; injection sweep skipped when nothing was deposited (nfbcells). Wall clock inconclusive at the anchor (+1.6% single sample vs ~1.6% node-to-node scatter on the normal queue; a second timing sample is archived in t16-feedback6-r1/state.json)."
      - id: T1.7
        title: "Guard debug reductions in RebuildHierarchy; remove Evtime barriers; fuse adjacent small allreduces"
        ref: "4.2"
        class: C1
        status: todo
        prs: []
        tests: []
      - id: T1.8
        title: "Enable RH_PERF (or TIMER regions); per-level dt-limiter diagnostic; multigrid iteration instrumentation"
        ref: "5.5"
        class: C0
        status: done
        prs: []
        tests: ["CI: serial bitwise determinism unchanged (run 14 green)", "FOGGIE-bench t18-instrumentation-r7: PASS class C0 vs 3-pair envelope noise floor at the production config (1 node x 128 ranks mil_ait), worst gate margin 3x; overhead 0.05% (below 0.5% timing noise)"]
        note: "Production-stamped 2026-07-29 at the corrected production config. First production numbers: RebuildHierarchy 7.2% of wall time, dominated by share(45s)+find(33s) of 175s cumulative; dt limited by Baryons/CFL on every level every cycle (L10 ~410-460 subcycles/root cycle); multigrid ~1.3-1.4M subgrid solves/root cycle at 1.18-1.20 avg V-cycles, zero fallbacks. Bonus: 128 vs 512 ranks changes 5-root-step wall time by only ~2% - the strong-scaling ceiling measured directly. Archive: results/t18-instrumentation-r7/ on bench-results."
      - id: T1.9
        title: "Visit-stamp dedup in FastSiblingLocatorFindSiblings; hash/sort the parent-grouping loop"
        ref: "3.2"
        class: C0
        status: done
