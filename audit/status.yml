        tests: ["FOGGIE-bench t21-partweight-r2: 4-arm sweep (weights 0/1/10/100) - particle weighting is a DECISIVE NEGATIVE, wall 2300 -> 3793 -> 5074 -> 6807 s"]
        note: "Particle-aware half is DONE and MEASURED NEGATIVE; keep LoadBalanceParticleWeight=0 (the default). Mechanism: total chemistry work is constant across arms (192/189/192/193 s) while its max/mean skew explodes (2.85 -> 14.88) and the barrier grows 1446 -> 5126 s - weighting particles does not change how much chemistry work exists, it just relocates cells onto the wrong ranks. Chemistry follows cells and per-cell Grackle iteration counts, and directly measured particle work is tiny (StarParticleHandler 0.6% of wall). Confound checked: the added rank-agreement Allreduce is ~4% of the regression. Two things landed and are worth keeping: the parameter (default 0 = bit-for-bit historical) and the rank-agreement Allreduce, which is a PREREQUISITE for any data-dependent weighting because particle counts are not replicated at balance time (see the ee9d6d10 commit message). REMAINING WORK: the measured-work variant - per-grid elapsed time from the previous cycle, via the existing LoadBalanceHilbertCurve(grid*[], int, float *InputGridWork, int*) overload. Full analysis: results/t21-partweight-r2/state.json on bench-results."
