# Audit remediation ledger for the enzo-performance effort.
#
# This file is the single source of truth for which audit recommendations are
# fixed and which remain. audit/build_dashboard.py renders it into
# audit/dashboard.html; CI rebuilds the dashboard automatically whenever this
# file changes on the enzo-performance branch (.github/workflows/audit-dashboard.yml).
#
# HOW TO UPDATE (in the same PR that fixes an item):
#   - set `status` to one of: todo | in-progress | done | wontfix
#   - append the PR number(s) to `prs` (plain integers)
#   - optionally add `tests` entries: short labels or URLs of the evidence
#     (CI job name, HPC benchmark result, answer-test run)
#   - optionally add a `note`
#
# `ref` is the section of audit/PERFORMANCE_AUDIT.md / enzoaudit.html the item
# comes from; the dashboard links it. `class` is the consistency class from the
# test plan (C0 bitwise / C1 roundoff / C2 answer-changing).
#
# BRANCH POLICY (2026-07-28): no PRs to main until further notice - all
# remediation work lands on enzo-performance only.

tiers:
  - id: tier0
    name: "Tier 0 - parameter files and build flags"
    description: "No code changes; try first"
    items:
      - id: T0.1
        title: "RebuildHierarchyCycleSkip[L] = 2-4 for L >= 4"
        ref: "3.2"
        class: C2
        status: done
        prs: []
        tests: ["FOGGIE-bench t01-rebuildskip-r1: skip=3 for L>=4 vs production skip=2 - answer changes far beyond the nondeterminism envelope (DD0398 mesh differs, stellar mass 5e-4 rel vs ~1e-7 gates) for -0.6% wall / ~5 s of rebuild"]
        note: "Resolved 2026-07-30 with a negative result + a discovery: production ALREADY runs RebuildHierarchyCycleSkip=2 on all levels 0-10 - the audit's recommendation was deployed before the audit, and its benefit is banked in every baseline. Going deeper (skip=3, L>=4) fails cost/benefit: real answer divergence (particle drift 2.4 cells exceeds the 2-cell flagging buffer, as the drift-budget arithmetic predicts) and negligible speedup. Keep production at skip=2; do not raise without also raising NumberOfBufferZones, and the measured payoff does not justify that experiment. Archive: t01-rebuildskip-r1 on bench-results."
      - id: T0.2
        title: "LoadBalancing = 4 (Hilbert)"
        ref: "4.1"
        class: C2
        status: done
        prs: []
        tests: ["Prereqs landed: T1.13 partitioner bug fixes + 128-bit key rework (keys were degenerate below 2^-19 separations - unusable for FOGGIE zoom levels)", "FOGGIE-bench t02-hilbert-r1: PASS class C0 vs the envelope floor (balancer change perturbs no more than parallel nondeterminism)"]
        note: "Experiment complete 2026-07-30; production default STAYS LoadBalancing=1. Measured at the anchor: wall 2212.3 vs 2231.3 s (-0.9%, near scatter); non-rebuild phases ~2% faster (real locality gain) but rebuild grew 179->209 s (loadbal 13->42 s: balancer cost + post-reassignment migration, partly a one-time restart-layout transition). Revisit after T2.1 - weights are still cells-only, where FOGGIE's imbalance actually lives. The Hilbert path is now correct and crash-free at production scale. Full analysis: t02-hilbert-r1/state.json on bench-results."
      - id: T0.3
        title: "SubgridSizeAutoAdjust = 0; MinimumSubgridEdge = 16; MaximumSubgridSize ~ 2.6e5"
        ref: "3.4"
        class: C2
        status: in-progress
        prs: []
        tests: ["FOGGIE-bench t03-subgrid-r1: 4-arm sweep. The audit's recommendation as written is 70% SLOWER (3853 vs 2260 s). The OPPOSITE direction (MaximumSubgridSize=400) is 24% FASTER (1716 s), barrier -46%."]
        note: "RECOMMENDATION INVERTED - the audit's direction (bigger grids) is actively harmful; its rationale (per-grid overhead, O(S^2) sibling searches) predates T1.9 which removed the sibling cost. Granularity, not weighting, is what drives FOGGIE's imbalance: L10 runs 195 grids over 128 ranks (1.52/rank) with sizes spanning 24-15552 cells, so the largest single grid is 2.35x a fair share and INDIVISIBLE - matching the measured 2.71x per-subcycle max/mean work. Capping subgrid size gives 436 grids, chem skew 2.81->2.04, and refines 15% less wasted padding (2.68M -> 2.27M cells at L>=8). C2 correctness (with the FIXED comparator, commit 92e436d0): baryon 5.9e-10, DM 9.3e-16, star count -0.088%, and the baryon excess matches the stellar deficit. ROOT CAUSE: DetermineSubgridSizeExtrema already computes the right cap (NumberOfCells/(nprocs*16) = 413 here) then discards it via max(., MINIMUM_SIZE) with a hard-coded '#define MINIMUM_SIZE 2000'. NEXT: make that floor a parameter (default 2000) so the existing adaptive formula is honoured at any rank count, rather than pinning 400 in the deck. Further headroom in T2.10: cap 400 should yield ~2117 grids, only 436 appear, because Berger-Rigoutsos cannot split a solidly-flagged region. Archive: results/t03-subgrid-r1/."
      - id: T0.4
        title: "Set MaximumGravityRefinementLevel = L_max - 2 (validate forces)"
        ref: "5.2"
        class: C2
        status: todo
        prs: []
        tests: []
      - id: T0.5
        title: "LoadBalancingMinLevel = 1; verify UnigridTranspose = 2, ParallelRootGridIO = 1, ParallelParticleIO = 1"
        ref: "4.2"
        class: C2
        status: todo
        prs: []
        tests: []
      - id: T0.6
        title: "TimingCycleSkip = 10; throttle FileDirectedOutput polling"
        ref: "5.4"
        class: C0
        status: done
        prs: []
        tests: ["Local serial A/B: bitwise identical", "CI green on dc98ab91 (run 30560321864)", "FOGGIE-bench instr2-r1: PASS class C0 vs the envelope floor (shared stamp with instrumentation pass 2)"]
        note: "The FileDirectedOutput block was worse than the audit's polling framing: 4 filesystem stats on rank 0 PLUS a 5-int MPI_Bcast synchronizing all ranks at every subcycle of every level. Now gated to the level-0 call - trigger-file latency is bounded at one root timestep, matching the feature's stated intent. TimingCycleSkip=10 is a production-deck recommendation (parameter exists); make_bench_run.py now pins TimingCycleSkip=1 so benches keep per-cycle data regardless."
      - id: T0.7
        title: "Restore -xAVX/-march and -ip on Pleiades (after T1.6 stack fix); add -heap-arrays"
        ref: "5.1"
        class: C1
        status: todo
        prs: []
        tests: []
