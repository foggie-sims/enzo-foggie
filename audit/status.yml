        note: "O(1) hashed sibling dedup (+ overflow guard fixes) and O(N) first-occurrence parent grouping. CI-validated bitwise (serial); production-validated against the measured noise floor (5 root steps, production restart). Wall-clock effect not measurable above 2.2% timing noise until T1.8 instrumentation lands."
      - id: T1.10
        title: "Lower GRIDS_PER_LOOP to ~512-1024; bounds-check CommunicationReceiveIndex"
        ref: "4.2"
        class: C1
        status: todo
        prs: []
        tests: []
      - id: T1.11
        title: "Re-enable Hilbert bounding-box normalization (3 commented-out lines)"
        ref: "4.1"
        class: C1
        status: wontfix
        prs: []
        tests: []
        note: "Superseded by the 128-bit Hilbert key rework (2026-07-30). Normalization would rescale by the per-call bounding box: near-identity for full-domain runs but anisotropic (distorts curve locality) and temporally unstable (keys shift whenever the balanced grid set changes -> churn). Instead HilbertCurve3D now returns an exact 126-bit integer key (42 octant levels, resolution 2^-42 of the domain in global coordinates) - deep-zoom grids resolve without any FOGGIE-specific geometry, sorting/partitioning are exact, and full-domain users keep their ordering (prefix property). The commented lines stay commented."
      - id: T1.12
        title: "Single-pass particle Courant reduction; single-pass particle-type histogram in CommunicationSyncNumberOfParticles"
        ref: "5.1"
        class: C0
        status: todo
        prs: []
