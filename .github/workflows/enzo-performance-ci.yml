# CI for the enzo-performance branch ONLY.
#
# This implements the per-PR gate of the performance test plan (audit/enzotestplan.html,
# sections 6.1 and 8): build checks, build-configuration guards, smoke runs of small
# self-initializing test problems, and a run-twice bitwise determinism check (the C0
# harness of test-plan section 3.1, run-to-run flavor: no gold data required).
#
# Branch scoping uses BOTH mechanisms:
#   1. This file lives only on the enzo-performance branch (do not merge it to main).
#   2. The triggers below filter on enzo-performance explicitly, so even if the file
#      is ever merged elsewhere, it still only fires for this branch and for PRs
#      targeting it.
#
# Phase-2 TODOs (see test plan section 8): gold-data answer tests via Git LFS,
# deterministic performance-counter regression checks, force-error tolerance gate on
# GravityTest, sanitizer build. Wall-clock timing is deliberately NOT gated here —
# hosted runners cannot time reliably; that lives on the HPC side.

name: enzo-performance CI

on:
  push:
    branches: [enzo-performance]
  pull_request:
    branches: [enzo-performance]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build, config guards, smoke + determinism tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out enzo-performance
        uses: actions/checkout@v4

      - name: Install toolchain (gfortran, OpenMPI, serial HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libopenmpi-dev openmpi-bin \
            libhdf5-serial-dev hdf5-tools csh

      - name: Configure build (machine-ubuntu, opt-high)
        run: |
          ./configure
          cd src/enzo
          make machine-ubuntu
          make opt-high
          make show-config | tee show-config.log

      # Build-configuration guards from the audit: a build without FAST_SIB is a
      # silent ~100x regression (audit section 3.3), and 128-bit particle positions
      # compile the CIC kernels to empty bodies (audit section 5.2.3).
      - name: Guard build configuration
        run: |
          cd src/enzo
          # show-config lines look like: "CONFIG_FAST_SIB  [fastsib-{yes,no}]  : yes"
          # -- parse the configured VALUE after the colon, not the option menu.
          getval() { grep "^   $1 " show-config.log | awk -F: '{gsub(/ /,"",$2); print $2}'; }
          fastsib=$(getval CONFIG_FAST_SIB)
          particles=$(getval CONFIG_PARTICLES)
          echo "CONFIG_FAST_SIB=$fastsib  CONFIG_PARTICLES=$particles"
          [ "$fastsib" = "yes" ] \
            || { echo "::error::CONFIG_FAST_SIB is '$fastsib', not 'yes' - refusing to test this configuration"; exit 1; }
          [ "$particles" != "128" ] \
            || { echo "::error::128-bit particle positions (CONFIG_PFLOAT_16): cic_deposit/cic_interp compile empty"; exit 1; }

      - name: Build enzo.exe
        run: |
          cd src/enzo
          make -j"$(nproc)"
          test -x enzo.exe

      - name: Smoke test — SedovBlastAMR (AMR hydro, rebuild machinery)
        timeout-minutes: 20
        run: |
          mkdir -p ci-tests/sedov-a && cd ci-tests/sedov-a
          cp ../../run/Hydro/Hydro-2D/SedovBlastAMR/SedovBlastAMR.enzo .
          mpirun --oversubscribe -np 4 ../../src/enzo/enzo.exe -d SedovBlastAMR.enzo > run.log 2>&1 \
            || { tail -50 run.log; exit 1; }
          grep -q "Successful run, exiting." run.log || grep -qi "exit" run.log
          ls DD*/ > /dev/null

      - name: Smoke test — GravityTest (ProblemType 23, force accuracy path)
        timeout-minutes: 10
        run: |
          mkdir -p ci-tests/gravity && cd ci-tests/gravity
          cp ../../run/GravitySolver/GravityTest/GravityTest.enzo .
          mpirun --oversubscribe -np 4 ../../src/enzo/enzo.exe -d GravityTest.enzo > run.log 2>&1 \
            || { tail -50 run.log; exit 1; }

      # Force-error tolerance gate (test plan section 4.1; ledger CI.4).
      # TestGravityCheckResults.out has one row per test particle:
      #   r/dx   f_tangential   f_radial   f_analytic
      # Errors are only meaningful outside the softened core, so the gate
      # applies at r/dx >= 2. Thresholds are provisional generous bounds for
      # the CIC + FFT point-mass response; tighten them to measured + margin
      # once a few runs establish the baseline (values are always printed).
      - name: Gate — gravity force accuracy
        run: |
          cd ci-tests/gravity
          python3 - <<'EOF'
          import glob, math, sys
          # Serial runs write TestGravityCheckResults.out; parallel runs write
          # one per-rank file with a task suffix (.out0000, .out0001, ...).
          files = sorted(glob.glob("TestGravityCheckResults.out*"))
          if not files:
              sys.exit("::error::no TestGravityCheckResults.out* files - gravity test wrote no results")
          rows = []
          for fn in files:
              with open(fn) as f:
                  for line in f:
                      p = line.split()
                      if len(p) == 4:
                          rows.append(tuple(float(x) for x in p))
          # Exercised-path assertions: the deck creates 5000 test particles.
          if len(rows) < 1000:
              sys.exit(f"::error::only {len(rows)} particle rows in TestGravityCheckResults.out - gravity test not exercised")
          far = [(r, ft, fr, fa) for (r, ft, fr, fa) in rows if r >= 2.0 and fa != 0.0]
          if len(far) < 100:
              sys.exit(f"::error::only {len(far)} particles beyond r/dx=2 - cannot assess force accuracy")
          rel = [abs(fr - fa) / fa for (_, _, fr, fa) in far]
          tan = [abs(ft) / fa for (_, ft, _, fa) in far]
          rms = math.sqrt(sum(e * e for e in rel) / len(rel))
          mx = max(rel)
          tmean = sum(tan) / len(tan)
          print(f"particles total={len(rows)} beyond 2dx={len(far)}")
          print(f"radial force error: rms={rms:.4f} max={mx:.4f}; mean tangential fraction={tmean:.4f}")
          RMS_TOL, MAX_TOL, TAN_TOL = 0.05, 0.30, 0.05
          bad = []
          if rms > RMS_TOL: bad.append(f"rms {rms:.4f} > {RMS_TOL}")
          if mx > MAX_TOL: bad.append(f"max {mx:.4f} > {MAX_TOL}")
          if tmean > TAN_TOL: bad.append(f"tangential {tmean:.4f} > {TAN_TOL}")
          if bad:
              sys.exit("::error::gravity force accuracy outside tolerance: " + "; ".join(bad))
          print("gravity force accuracy within tolerance")
          EOF

      - name: Smoke test — TestOrbit (particle dynamics across levels)
        timeout-minutes: 25
        run: |
          mkdir -p ci-tests/orbit && cd ci-tests/orbit
          cp ../../run/GravitySolver/TestOrbit/TestOrbit.enzo .
          mpirun --oversubscribe -np 2 ../../src/enzo/enzo.exe -d TestOrbit.enzo > run.log 2>&1 \
            || { tail -50 run.log; exit 1; }

      # The FOGGIE star-particle path: star_maker2/star_feedback6 mechanical
      # feedback with tabular yields (ProblemType 90, single 2000-Msun star).
      # This is the coverage that makes the Tier-1 star-particle fixes
      # CI-gateable. StopTime is shortened from the deck's 50 Myr; a few Myr
      # exercises table integration, stochastic draws, and injection.
      - name: Smoke test — TabularFeedbackTest (star_feedback6, np=4)
        timeout-minutes: 25
        run: |
          mkdir -p ci-tests/star-smoke && cd ci-tests/star-smoke
          cp ../../run/StarParticle/TabularFeedbackTest/TestMechAndTabFeedback.enzo .
          cp ../../run/StarParticle/TabularFeedbackTest/*.h5 ../../run/StarParticle/TabularFeedbackTest/*.hdf5 . 2>/dev/null || true
          # Canonical deck (StopTime = 50 Myr): the static ambient medium makes
          # steps cheap, and the full window covers the SNII + SNIa epochs.
          mpirun --oversubscribe -np 4 ../../src/enzo/enzo.exe -d TestMechAndTabFeedback.enzo > run.log 2>&1 \
            || { tail -50 run.log; exit 1; }
          ls DD*/ > /dev/null
          # Prove the run exercised SN injection: nsn is column 9 of the
          # per-rank particle feedback log.
          awk '$9 > 0 {found=1} END {exit !found}' feedbacklog_parts_*.txt \
            || { echo "::error::no SN events logged - smoke test did not exercise feedback injection"; exit 1; }

      # C0 determinism harness (test plan section 3.1, run-to-run flavor): the same
      # executable and problem must produce bit-identical outputs. Catches
      # uninitialized memory and unseeded nondeterminism without stored gold data.
      #
      # MEASURED CONSTRAINT (run 3 of this workflow): at np=4 the default build is
      # NOT run-to-run bitwise reproducible even for pure hydro — message-arrival
      # order in the AMR flux/boundary accumulation changes floating-point
      # summation order, and the differences grow chaotically (hundreds of cells
      # by t=0.3). CONFIG_BITWISE_IDENTICALITY only covers the gravity/photon
      # paths, not hydro. So the strict bitwise gate runs SERIAL (np=1), where
      # execution order is fixed; parallel reproducibility is tracked as audit
      # ledger item T1.14. Deck is shortened to keep two serial runs fast.
      - name: Determinism — serial run A
        timeout-minutes: 20
        run: |
          mkdir -p ci-tests/det-a && cd ci-tests/det-a
          cp ../../run/Hydro/Hydro-2D/SedovBlastAMR/SedovBlastAMR.enzo .
          sed -i 's/^StopTime.*/StopTime                  = 0.05/' SedovBlastAMR.enzo
          mpirun --oversubscribe -np 1 ../../src/enzo/enzo.exe -d SedovBlastAMR.enzo > run.log 2>&1 \
            || { tail -50 run.log; exit 1; }

      - name: Determinism — serial run B
        timeout-minutes: 20
        run: |
          mkdir -p ci-tests/det-b && cd ci-tests/det-b
          cp ../../run/Hydro/Hydro-2D/SedovBlastAMR/SedovBlastAMR.enzo .
          sed -i 's/^StopTime.*/StopTime                  = 0.05/' SedovBlastAMR.enzo
          mpirun --oversubscribe -np 1 ../../src/enzo/enzo.exe -d SedovBlastAMR.enzo > run.log 2>&1 \
            || { tail -50 run.log; exit 1; }

      # Star-path serial determinism: valid only because star_feedback6 now
      # seeds its RNG deterministically by rank (audit item T1.6, seeding
      # part); before that fix, draw_stochastic used OS-entropy seeding and
      # no two runs agreed even serially.
      - name: Determinism — star feedback serial runs A and B
        timeout-minutes: 30
        run: |
          for r in a b; do
            mkdir -p "ci-tests/star-$r" && pushd "ci-tests/star-$r" > /dev/null
            cp ../../run/StarParticle/TabularFeedbackTest/TestMechAndTabFeedback.enzo .
            cp ../../run/StarParticle/TabularFeedbackTest/*.h5 ../../run/StarParticle/TabularFeedbackTest/*.hdf5 . 2>/dev/null || true
            # 10 Myr: past SNII onset (~4 Myr), so the stochastic draws and the
            # injection sweep genuinely execute; short of the full 50 Myr deck.
            sed -i 's/^StopTime.*/StopTime               = 10.0/' TestMechAndTabFeedback.enzo
            mpirun --oversubscribe -np 1 ../../src/enzo/enzo.exe -d TestMechAndTabFeedback.enzo > run.log 2>&1 \
              || { tail -50 run.log; exit 1; }
            popd > /dev/null
          done
          # The determinism claim is vacuous if no SNe fired: require events,
          # and require the two runs' SN event logs to match exactly (this is
          # the direct test of the seeded RNG stream).
          awk '$9 > 0 {found=1} END {exit !found}' ci-tests/star-a/feedbacklog_parts_*.txt \
            || { echo "::error::no SN events in determinism runs - stochastic path not exercised"; exit 1; }
          diff ci-tests/star-a/feedbacklog_parts_00000000.txt ci-tests/star-b/feedbacklog_parts_00000000.txt \
            || { echo "::error::SN event logs differ between identical serial runs - RNG seeding is not deterministic"; exit 1; }

      - name: Determinism — bitwise compare A vs B
        run: |
          cd ci-tests
          status=0
          for pair in "det-a det-b" "star-a star-b"; do
          set -- $pair
          A=$1; B=$2
          echo "=== comparing $A vs $B ==="
          for dumpdir in "$A"/DD*/; do
            d=$(basename "$dumpdir")
            [ -d "$B/$d" ] || { echo "::error::$B missing dump $d"; status=1; continue; }
            for f in "$A/$d"/*; do
              b="$B/$d/$(basename "$f")"
              [ -f "$b" ] || { echo "::error::run B missing file: $f"; status=1; continue; }
              case "$(basename "$f")" in
                *.cpu*)
                  # HDF5 field/particle data must be bit-identical.
                  h5diff "$f" "$b" || { echo "::error::h5diff mismatch: $f"; status=1; } ;;
                *.boundary.hdf)
                  h5diff "$f" "$b" || { echo "::error::h5diff mismatch: $f"; status=1; } ;;
                *.hierarchy|*.boundary)
                  diff -q "$f" "$b" || { echo "::error::metadata mismatch: $f"; status=1; } ;;
                *)
                  # Parameter file and friends: identical modulo lines that
                  # legitimately vary run-to-run (wall-clock stamps and the
                  # per-run UUIDs minted under CONFIG_UUID=yes).
                  VARY='CurrentTimeIdentifier|InitialCPUTime|MetaDataSimulationUUID|MetaDataDatasetUUID|MetaDataRestartDatasetUUID|MetaDataInitialConditionsUUID'
                  diff <(grep -vE "$VARY" "$f") \
                       <(grep -vE "$VARY" "$b") \
                    || { echo "::error::text file mismatch: $f"; status=1; } ;;
              esac
            done
          done
          done
          [ "$status" -eq 0 ] && echo "All outputs bit-identical between runs A and B."
          exit $status

      - name: Upload logs and gravity results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-logs
          path: |
            ci-tests/**/run.log
            ci-tests/gravity/TestGravityCheckResults.out*
            src/enzo/show-config.log
          if-no-files-found: ignore

  # Ledger CI.3: ASan+UBSan build running the short serial decks in parallel
  # with the main job. ASan (out-of-bounds, use-after-free, double free)
  # aborts the run on first error -> the run step fails. UBSan runs in
  # recovering mode so a single run inventories every report; the scan step
  # fails on any "runtime error:" line. Leak checking is off until the
  # audit's known allocation-lifetime issues (T1.13) are fixed.
  sanitizers:
    name: ASan+UBSan serial decks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - name: Check out enzo-performance
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran libopenmpi-dev openmpi-bin libhdf5-serial-dev csh

      - name: Build sanitized enzo.exe
        run: |
          ./configure
          cd src/enzo
          make machine-ubuntu-sanitize
          make opt-high
          make -j"$(nproc)"
          test -x enzo.exe

      - name: Run SedovBlastAMR (serial, short) under sanitizers
        timeout-minutes: 30
        run: |
          mkdir -p san-tests/sedov && cd san-tests/sedov
          cp ../../run/Hydro/Hydro-2D/SedovBlastAMR/SedovBlastAMR.enzo .
          sed -i 's/^StopTime.*/StopTime                  = 0.05/' SedovBlastAMR.enzo
          mpirun --oversubscribe -np 1 ../../src/enzo/enzo.exe -d SedovBlastAMR.enzo > run.log 2>&1 \
            || { echo "::error::sanitized SedovBlastAMR run failed (see log tail)"; tail -80 run.log; exit 1; }
          ls DD*/ > /dev/null

      - name: Run TabularFeedbackTest (serial, short) under sanitizers
        timeout-minutes: 30
        run: |
          mkdir -p san-tests/star && cd san-tests/star
          cp ../../run/StarParticle/TabularFeedbackTest/TestMechAndTabFeedback.enzo .
          cp ../../run/StarParticle/TabularFeedbackTest/*.h5 ../../run/StarParticle/TabularFeedbackTest/*.hdf5 . 2>/dev/null || true
          sed -i 's/^StopTime.*/StopTime               = 10.0/' TestMechAndTabFeedback.enzo
          mpirun --oversubscribe -np 1 ../../src/enzo/enzo.exe -d TestMechAndTabFeedback.enzo > run.log 2>&1 \
            || { echo "::error::sanitized TabularFeedbackTest run failed (see log tail)"; tail -80 run.log; exit 1; }
          ls DD*/ > /dev/null

      - name: Scan for sanitizer reports
        run: |
          status=0
          for log in san-tests/*/run.log; do
            if grep -n "runtime error:" "$log" | sort -u | head -40; then
              n=$(grep -c "runtime error:" "$log" || true)
              [ "$n" -gt 0 ] && { echo "::error::$n UBSan report(s) in $log"; status=1; }
            fi
            if grep -q "AddressSanitizer" "$log"; then
              grep -n -m5 "AddressSanitizer" "$log"
              echo "::error::ASan report(s) in $log"; status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "No sanitizer reports."
          exit $status

      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: san-tests/**/run.log
          if-no-files-found: ignore
